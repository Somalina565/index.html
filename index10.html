<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Атрибути Посилань — Експеримент</title>
</head>
<body>
    <h1>Детальний Розбір Атрибутів &lt;a&gt;</h1>

    <h2>Посилання у новій вкладці та підказка</h2>
    <p>
        <a href="https://google.com" target="_blank"
           title="Перехід на головну сторінку Google у новій вкладці.">
            Перейти на Google
        </a>
    </p>

    <h2>Посилання для E-mail</h2>
    <p>
        <a href="mailto:support@example.com?subject=Питання%20щодо%20HTML%20конспекту">
            Написати нам листа
        </a>
    </p>

    <h2>Посилання для Завантаження</h2>
    <p>
        <a href="https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf"
           download="Конспект_уроку_PDF.pdf">
            Завантажити Приклад PDF
        </a>
    </p>

    <!-- Експеримент: додано посилання на навчальний ресурс -->
    <h2>Додаткове посилання</h2>
    <p>
        <a href="https://www.w3schools.com/html/" target="_blank"
           title="Навчальний матеріал з HTML">
            Відкрити HTML Tutorial
        </a>
    </p>

    <hr>
</body>
</html>
