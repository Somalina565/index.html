<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Кольори — Експеримент</title>
</head>
<body style="background-color: #f0f8ff;">

    <h1 style="color: navy;">HTML Кольори</h1>

    <p style="color: rgb(0, 128, 0);">
        Цей текст має зелений колір, заданий через RGB.
    </p>

    <p style="color: #b22222; background-color: #fff0f0;">
        Цей текст має колір HEX, а фон змінено під час експерименту.
    </p>

    <h2 style="color: tomato; background-color: #fff8dc; padding: 10px;">
        Експеримент з кольорами
    </h2>

    <p style="color: purple;">
        Тут використано назву кольору purple.
    </p>

    <p>
        Під час експерименту я змінив кольори тексту та фону.
    </p>

    <hr>
</body>
</html>
