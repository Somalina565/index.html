<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Коментарі — Експеримент</title>
</head>
<body>
    <!-- Головна секція сторінки -->
    <h1>Як використовувати Коментарі</h1>

    <p>Коментарі не відображаються у браузері, але є видимими у вихідному коді сторінки.</p>

    <!-- Експеримент: цей заголовок можна швидко приховати, додавши його в коментар -->
    <h2>Закоментований Контент</h2>

    <!--
        Цей параграф повністю закоментований.
        Він не з'явиться на сторінці.
        <p>Це прихований текст.</p>
    -->

    <p>
        Весь закоментований код (включно з тегами) ігнорується браузером.
    </p>

    <!-- Експеримент: доданий коментар для пояснення нового елемента -->
    <p><mark>Цей абзац додано під час експерименту.</mark></p>

    <hr>
</body>
</html>
